[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "django-tron-payments"
version = "0.1.0"
description = "Reusable, custodial TRON payment processing for Django using TronGrid."
readme = "README.md"
requires-python = ">=3.11.9"
license = { text = "MIT" }
authors = [
  { name = "django-tron-payments contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "celery>=5.4,<6.0",
  "cryptography>=43.0,<46.0",
  "Django>=5.1,<5.3",
  "requests>=2.32,<3.0",
  "tronpy>=0.5.0,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9.0",
  "pytest-django>=4.9,<5.0",
  "pytest-mock>=3.14,<4.0",
  "ruff>=0.9,<1.0",
]

[project.urls]
Documentation = "https://github.com/your-organization/django-tron-payments#readme"
Issues = "https://github.com/your-organization/django-tron-payments/issues"
Source = "https://github.com/your-organization/django-tron-payments"

[tool.hatch.build.targets.wheel]
packages = ["src/django_tron_payments"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
